<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TC People - HR &amp; Payroll Operations</title>

    <!-- Google Fonts: Fraunces, Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Global Exception Filter for Injected Browser Extension Scripts -->
    <script>
      window.addEventListener(
        'error',
        function (event) {
          if (
            event.message &&
            (event.message.includes("reading 'startTime'") ||
              event.message.includes('reportAllChanges') ||
              event.filename === '' ||
              (event.filename && event.filename.includes('chrome-extension')))
          ) {
            event.preventDefault()
            event.stopPropagation()
            return true
          }
        },
        true
      )
    </script>

    <!-- Material Symbols Outlined -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F7F5F1] text-[#1C1B19] font-body antialiased selection:bg-[#0F5C4A]/15 selection:text-[#0F5C4A]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
